name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: npm run build

      - if: matrix.node-version == '22.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v4
        with:
          path: |
            .next
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits
          submodules: recursive

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: npm run lint

      - name: Type checking
        run: npm run check:types

      - name: Check dependencies
        run: npm run check:deps

      - name: Security audit
        # Audit runs but doesn't fail CI due to unfixable transitive deps
        run: npm audit --audit-level=critical || true

  unit:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # dojo-planner owns the authoritative schema. src/lib/schemaParity.test.ts
      # compares the kiosk's local table declarations against it and FAILS when
      # the kiosk declares a column dojo-planner no longer has — the only check
      # that catches a rename/drop in the other repo before it reaches
      # production as `column "..." does not exist` on the payment path.
      # Without this checkout the gate silently skips.
      #
      # Auth is a GitHub App scoped to Contents:read on dojo-planner only, so the
      # credential is not tied to any individual's account and cannot write.
      # Requires repo secrets DOJO_PLANNER_APP_ID and DOJO_PLANNER_APP_PRIVATE_KEY.
      - name: Mint dojo-planner read token
        id: planner-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOJO_PLANNER_APP_ID }}
          private-key: ${{ secrets.DOJO_PLANNER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dojo-planner

      - name: Check out dojo-planner (schema source of truth)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/dojo-planner
          path: .dojo-planner
          token: ${{ steps.planner-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # Fail loudly here rather than letting the parity gate skip silently —
      # a skipped gate looks identical to a passing one in the CI summary.
      - name: Verify dojo-planner schema is present
        run: |
          if [ ! -f "${{ github.workspace }}/.dojo-planner/src/models/Schema.ts" ]; then
            echo "::error::dojo-planner schema not found. The schema-parity gate would skip."
            echo "::error::Check the DOJO_PLANNER_APP_ID / DOJO_PLANNER_APP_PRIVATE_KEY secrets,"
            echo "::error::and that the GitHub App is installed on the dojo-planner repository."
            exit 1
          fi
          echo "dojo-planner schema found — parity gate will run."

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.62.0-noble
        env:
          DOJO_PLANNER_DIR: ${{ github.workspace }}/.dojo-planner
        with:
          args: npx vitest --coverage --passWithNoTests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    strategy:
      matrix:
        node-version: [22.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.59.1-noble
        with:
          args: npx playwright test --pass-with-no-tests

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
